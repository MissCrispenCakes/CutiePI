[platformio]
name         = CutiePI
default_envs = bear
boards_dir   = boards

# ── Shared settings ───────────────────────────────────────────────────────────
# All named environments below inherit these. Override only what differs.
[env]
platform                = espressif32 @ 6.5.0
board                   = waveshare_esp32s3_touch_lcd_146b
framework               = arduino
monitor_speed           = 115200
monitor_dtr             = 0
monitor_rts             = 0
upload_speed            = 921600
board_build.partitions  = default_16MB.csv
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1

# ── ESP-NOW build (default) ───────────────────────────────────────────────────
# Same room / building only. No router or internet required.
# No external libraries — everything ships inside the espressif32 Arduino core.
# Usage: pio run   (or pio run -e bear)
[env:bear]

# ── MQTT build (long-distance) ────────────────────────────────────────────────
# Bears connect to a shared MQTT broker over the internet — works globally.
# Copy include/secrets.h.example → include/secrets.h and fill in credentials first.
# Usage: pio run -e bear-mqtt
[env:bear-mqtt]
build_flags =
    ${env.build_flags}
    -DUSE_MQTT
lib_deps =
    knolleary/PubSubClient @ ^2.8
