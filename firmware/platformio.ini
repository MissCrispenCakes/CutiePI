[platformio]
name         = CutiePI
default_envs = bear
boards_dir   = boards

# ── Shared settings ───────────────────────────────────────────────────────────
# All named environments below inherit these. Override only what differs.
# Note: -DARDUINO_USB_CDC_ON_BOOT is NOT here — it is board-specific.
#   Touch LCD 1.46B has no USB-UART chip and needs USB CDC (set in [env:bear*]).
#   DualEye 1.28 has a CH343P USB-UART chip and must NOT enable USB CDC.
[env]
platform                = espressif32 @ 6.5.0
framework               = arduino
monitor_speed           = 115200
monitor_dtr             = 0
monitor_rts             = 0
upload_speed            = 921600
board_build.partitions  = default_16MB.csv
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE

# ── Touch LCD 1.46B — ESP-NOW (default) ──────────────────────────────────────
# Same room / building only. No router or internet required.
# Requires: lvgl/lvgl ^8.3.0 (downloaded automatically by PlatformIO on first build)
# Usage: pio run   (or pio run -e bear)
[env:bear]
board       = waveshare_esp32s3_touch_lcd_146b
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lvgl/lvgl @ ^8.3.0

# ── Touch LCD 1.46B — MQTT (long-distance) ───────────────────────────────────
# Bears connect to a shared MQTT broker over the internet — works globally.
# Copy include/secrets.h.example → include/secrets.h and fill in credentials first.
# Usage: pio run -e bear-mqtt
[env:bear-mqtt]
board       = waveshare_esp32s3_touch_lcd_146b
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_MQTT
lib_deps =
    lvgl/lvgl @ ^8.3.0
    knolleary/PubSubClient @ ^2.8

# ── DualEye 1.28 — ESP-NOW ───────────────────────────────────────────────────
# ⚠ INCOMPLETE — boards not yet in hand. Pin assignments in config_dualeye.h
# must be verified against the schematic before this environment will compile.
# CH343P USB-to-UART chip: Serial works like a normal Arduino board.
# Usage: pio run -e dualeye
[env:dualeye]
board       = waveshare_esp32s3_dualeye_touch_lcd_128
build_flags =
    ${env.build_flags}
    -DBOARD_DUALEYE

# ── DualEye 1.28 — MQTT (long-distance) ──────────────────────────────────────
# ⚠ INCOMPLETE — see [env:dualeye] note above.
# Usage: pio run -e dualeye-mqtt
[env:dualeye-mqtt]
board       = waveshare_esp32s3_dualeye_touch_lcd_128
build_flags =
    ${env.build_flags}
    -DBOARD_DUALEYE
    -DUSE_MQTT
lib_deps =
    knolleary/PubSubClient @ ^2.8
