[platformio]
name = CutiePI

# ── Dependency note ───────────────────────────────────────────────────────────
# This project has NO external library dependencies.
# Every API used (ESP-NOW, WiFi, LEDC, ADC) ships inside the espressif32
# Arduino core and is downloaded once as part of the platform package below.
# After the initial `pio run`, builds work fully offline.
# ─────────────────────────────────────────────────────────────────────────────

# ── ESP-NOW build (default) ───────────────────────────────────────────────────
# Same room / building only. No router or internet required.
# Usage: pio run -e bear   (or just pio run)
[env:bear]
platform       = espressif32 @ 6.5.0
board          = esp32-s3-devkitc-1
framework      = arduino
monitor_speed  = 115200
upload_speed   = 921600
build_flags    =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
lib_deps       =
    # intentionally empty — no third-party libraries required

# ── MQTT build (long-distance) ────────────────────────────────────────────────
# Bears connect to a shared MQTT broker over the internet — works globally.
# Set WIFI_SSID, WIFI_PASSWORD, and MQTT_BROKER in include/config.h first.
# Usage: pio run -e bear-mqtt
[env:bear-mqtt]
platform       = espressif32 @ 6.5.0
board          = esp32-s3-devkitc-1
framework      = arduino
monitor_speed  = 115200
upload_speed   = 921600
build_flags    =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DUSE_MQTT
lib_deps       =
    knolleary/PubSubClient @ ^2.8
